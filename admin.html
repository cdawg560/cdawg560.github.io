<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Gallery Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--cream:#f8f4ef;--ink:#28352e;--sage:#788878;--paper:#fffdf9;--line:#e7ded4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}h1,h2{font-family:'Playfair Display',serif;font-weight:500}header{text-align:center;padding:28px;border-bottom:1px solid var(--line)}main{max-width:1100px;margin:auto;padding:25px 16px}.panel{background:var(--paper);border:1px solid var(--line);padding:20px;margin-bottom:20px;border-radius:5px}label{display:block;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid var(--line);font:inherit}button,.btn{display:inline-block;margin:8px 5px 0 0;padding:10px 15px;border:0;border-radius:4px;background:var(--sage);color:white;font:inherit;cursor:pointer;text-decoration:none}.danger{background:#9c5b55}.muted{color:#697067;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.item{background:white;border:1px solid var(--line);padding:9px;overflow-wrap:anywhere}.item img,.item video{width:100%;height:190px;object-fit:cover}.item .select-row{display:flex;align-items:center;gap:8px;margin:4px 0 8px}.item .select-row input{width:auto}.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.bulkbar input{width:auto}.hidden{display:none}.status{min-height:1.5em;color:var(--sage)}a{color:inherit}button:disabled{opacity:.5}
</style></head><body><header><h1>Wedding Gallery Admin</h1><p>Alex & Cierra · Private management</p><a href="index.html">← Wedding website</a></header><main><section class="panel" id="loginPanel"><h2>Admin sign in</h2><p class="muted">Sign in with the admin password configured in your Cloudflare Worker.</p><form id="loginForm"><label>Admin password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><div id="loginStatus" class="status"></div></section><section id="dashboard" class="hidden"><div class="panel"><h2>Manage uploads</h2><p id="count" class="muted"></p><button id="downloadAll">Download active gallery as ZIP</button><button id="refresh">Refresh</button><button id="logout" class="danger">Sign out</button><p class="muted">Are you should you'd like to delete. It cannot be restored.</p><div id="adminStatus" class="status"></div></div><div class="panel bulkbar"><label style="display:flex;align-items:center;gap:8px;margin:0"><input type="checkbox" id="selectAll" style="width:auto"> Select all</label><span id="selectedCount" class="muted">0 selected</span><button id="bulkDelete" class="danger" disabled>Delete selected</button></div><div id="adminGrid" class="grid"></div></section></main>
<script>
const API_BASE='https://wedding-gallery-api.luisandreagan.workers.dev';const loginPanel=document.getElementById('loginPanel'),dash=document.getElementById('dashboard'),loginStatus=document.getElementById('loginStatus'),status=document.getElementById('adminStatus'),grid=document.getElementById('adminGrid');let token=sessionStorage.getItem('weddingAdminToken')||'',uploads=[];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function mediaUrl(key){return API_BASE+'/media/'+key.split('/').map(encodeURIComponent).join('/')}
async function api(path,opts={}){const headers={...(opts.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(API_BASE+path,{...opts,headers});if(!r.ok)throw Error((await r.text())||r.statusText);return r}
function showDash(){loginPanel.classList.add('hidden');dash.classList.remove('hidden');load()}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginStatus.textContent='Signing in…';try{const r=await fetch(API_BASE+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(!r.ok)throw Error();const d=await r.json();token=d.token;sessionStorage.setItem('weddingAdminToken',token);loginStatus.textContent='';showDash()}catch{loginStatus.textContent='Sign-in failed. Check the admin password and Worker configuration.'}});
async function load(){status.textContent='Loading…';try{const r=await api('/api/admin/list');const d=await r.json();uploads=d.items||[];document.getElementById('count').textContent=`${uploads.length} active upload(s)`;render();status.textContent=''}catch(e){console.error(e);status.textContent='Session expired or Worker unavailable. Sign in again.'}}
function render(){grid.innerHTML=uploads.map(x=>{const v=(x.contentType||'').startsWith('video/'),url=mediaUrl(x.key);return `<article class="item"><label class="select-row"><input type="checkbox" data-select="${esc(x.key)}"> Select</label>${v?`<video controls preload="metadata" src="${url}"></video>`:`<a href="${url}" target="_blank" rel="noopener"><img loading="lazy" src="${url}" alt=""></a>`}<p><b>${esc(x.guestName||'Guest')}</b><br>${esc(x.name||'Memory')}</p><button data-download="${esc(x.key)}">Download</button><button class="danger" data-key="${esc(x.key)}">Delete</button></article>`}).join('');grid.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>moveToDeleted(b.dataset.key));grid.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadOne(b.dataset.download));grid.querySelectorAll('[data-select]').forEach(c=>c.onchange=updateSelection);document.getElementById('selectAll').checked=false;updateSelection()} 
function selectedKeys(){return [...grid.querySelectorAll('[data-select]:checked')].map(c=>c.dataset.select)}
function updateSelection(){const selected=selectedKeys();document.getElementById('selectedCount').textContent=`${selected.length} selected`;document.getElementById('bulkDelete').disabled=!selected.length;const all=grid.querySelectorAll('[data-select]');document.getElementById('selectAll').checked=all.length>0&&selected.length===all.length} 
document.getElementById('selectAll').onchange=e=>{grid.querySelectorAll('[data-select]').forEach(c=>c.checked=e.target.checked);updateSelection()};
document.getElementById('bulkDelete').onclick=async()=>{const keys=selectedKeys();if(!keys.length)return;if(!confirm(`Delete ${keys.length} selected file(s)? This action cannot be undone. Continue?`))return;const btn=document.getElementById('bulkDelete');btn.disabled=true;let done=0,failed=0;for(const key of keys){status.textContent=`Deleting ${done+failed+1} of ${keys.length}…`;try{await api('/api/admin/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});done++}catch(err){console.error(err);failed++}}await load();status.textContent=failed?`Bulk delete finished: ${done} deleted, ${failed} failed.`:`Successfully deleted ${done} file(s).`};
async function downloadOne(key){try{const r=await api('/api/admin/download-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});const d=await r.json();const file=await fetch(d.url);if(!file.ok)throw Error('Download failed');const blob=await file.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(uploads.find(x=>x.key===key)?.name||'memory');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){console.error(e);status.textContent='Could not prepare download.'}}
async function moveToDeleted(key){const x=uploads.find(y=>y.key===key);if(!x||!confirm(`Delete ${x.name||'this file'}? It will be deleted and cannot be recovered Continue?`))return;try{status.textContent='deleted…';await api('/api/admin/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});await load();status.textContent='Deleted.'}catch(e){console.error(e);status.textContent='Delete failed.'}}
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=()=>{token='';sessionStorage.removeItem('weddingAdminToken');dash.classList.add('hidden');loginPanel.classList.remove('hidden');loginStatus.textContent='Signed out.'};
document.getElementById('downloadAll').onclick=async()=>{if(!uploads.length){status.textContent='No files to download.';return}try{status.textContent='Preparing ZIP…';const{default:JSZip}=await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm'),zip=new JSZip();for(let i=0;i<uploads.length;i++){const x=uploads[i];status.textContent=`Adding ${i+1}/${uploads.length}…`;let fetchUrl=mediaUrl(x.key);const r=await fetch(fetchUrl);if(!r.ok)throw Error('Download failed');zip.file(`${String(i+1).padStart(3,'0')}_${(x.name||'memory').replace(/[\\/:*?"<>|]/g,'_')}`,await r.blob())}const blob=await zip.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wedding-gallery.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='ZIP download started.'}catch(e){console.error(e);status.textContent='ZIP failed; try individual downloads.'}};
if(token)showDash();
</script></body></html>
